{% load static %}
{% load i18n %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Custom Navigation CSS -->
<link rel="stylesheet" href="{% static 'css/navigation.css' %}">

<nav class="navbar navbar-expand-lg" data-bs-theme="dark">
  <div class="container-fluid">
    <!-- Brand/Logo -->
    <a class="navbar-brand" href="{% url 'medlexicon:index' %}">
      <i class="fas fa-book-medical me-2"></i>MedLexicon
    </a>
    
    <!-- Toggle button for mobile -->
    <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <!-- Navigation content -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Left side navigation items -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="{% url 'medlexicon:index' %}">
            <i class="fas fa-home me-1"></i>Home
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
              class="nav-link dropdown-toggle"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
          >
            <i class="fas fa-bars me-1"></i>Menu
          </a>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="{% url 'medlexicon:index' %}">
                <i class="fas fa-home me-2"></i>Home
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'medlexicon:worker-list' %}">
                <i class="fas fa-users me-2"></i>All employees
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'medlexicon:word-list' %}">
                <i class="fas fa-language me-2"></i>All words
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'medlexicon:category-list' %}">
                <i class="fas fa-tags me-2"></i>Categories
              </a>
            </li>
          </ul>
        </li>
      </ul>
      
      <!-- Center search container -->
      <div class="search-container">
        <form method="GET" action="{% url 'medlexicon:word-list' %}" class="search-form">
          <input 
            type="text" 
            name="q" 
            class="search-input" 
            placeholder="{% trans 'Search words...' %}"
            value="{{ request.GET.q }}"
            aria-label="Search words"
          >
          <button type="submit" class="search-button">
            <i class="fas fa-search me-1"></i><span>Search</span>
          </button>
        </form>
      </div>
      
      <!-- Right side items (if needed) -->
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <!-- Add any additional right-side navigation items here -->
      </ul>
    </div>
  </div>
</nav>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/translation.js' %}"></script>
