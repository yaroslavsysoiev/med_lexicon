<!DOCTYPE html>
<html lang="uk">

<head>
    <title>Вихід з системи - MedLexicon</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-section">
                    <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                </div>
                <h1 class="login-title">Успішний вихід</h1>
                <p class="login-subtitle">Ви успішно вийшли з системи MedLexicon</p>
            </div>

            <div class="alert alert-success text-center" role="alert">
                <i class="fas fa-info-circle"></i>
                <strong>Дякуємо за використання нашої системи!</strong>
            </div>

            <div class="text-center">
                <a href="{% url 'login' %}" class="btn btn-primary btn-block login-btn">
                    <i class="fas fa-sign-in-alt"></i> Увійти знову
                </a>
            </div>

            <div class="login-footer">
                <p class="text-center">
                    <small class="text-muted">© 2024 MedLexicon. Всі права захищені.</small>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</body>

</html>
